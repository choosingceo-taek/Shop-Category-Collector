<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui;width:300px;padding:14px;margin:0}

<h3>Walmart Category Collector</h3>

<div id="status"></div>
<script src="popup.js"></script>
</body></html>
