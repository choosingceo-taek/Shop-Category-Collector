<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Lens — LAB</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:rgba(11,11,11,.11); --accent:#2a78d6; --accent-ink:#fff; --wash:rgba(42,120,214,.08);
    --sale:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0d; --card:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
      --line:rgba(255,255,255,.12); --accent:#3987e5; --wash:rgba(57,135,229,.14); --sale:#e66767; }
  }
  * { box-sizing:border-box; }
  /* the hidden attribute must always win — .filters is display:flex, which
     silently overrides the UA's [hidden]{display:none} and left the products
     search bar visible (and dead) on every tab */
  [hidden] { display:none !important; }
  /* on the feed/brand tabs only the search is meaningful — the dropdowns and
     export buttons act on the 상품 grid and would lie anywhere else */
  .filters.slim > :not(#q) { display:none; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, select, input { font:inherit; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); padding:8px 11px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }

  header { position:sticky; top:0; z-index:5; background:var(--card);
    border-bottom:1px solid var(--line); padding:14px 20px; }
  .top { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:-.01em; }
  .stats { color:var(--muted); font-size:12.5px; }
  .filters { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; align-items:center; }
  .filters input[type=search] { min-width:230px; flex:1; }
  .selbar { display:none; align-items:center; gap:10px; margin-top:10px; padding:9px 12px;
    background:var(--wash); border-radius:9px; font-size:13px; }
  .selbar.on { display:flex; }

  main { padding:16px 20px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:13px; }
  .c { border:1px solid var(--line); border-radius:11px; background:var(--card); overflow:hidden;
    display:flex; flex-direction:column; position:relative; }
  .c.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--wash); }
  .c .thumb { aspect-ratio:3/4; background:var(--line); display:block; width:100%; object-fit:cover; }
  .c .body { padding:9px 10px 11px; display:flex; flex-direction:column; gap:3px; }
  .c .bd { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .c .nm { font-size:12.5px; line-height:1.35; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .c .pr { font-size:12.5px; font-weight:600; }
  .c .pr s { color:var(--muted); font-weight:400; margin-left:5px; }
  .c .pr.sale { color:var(--sale); }
  .c .fb { font-size:11px; color:var(--ink2); }
  .c a { color:inherit; text-decoration:none; }
  .c .pick { position:absolute; top:8px; left:8px; width:20px; height:20px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:70px 20px; line-height:1.8; }
  .empty b { color:var(--ink); }

  /* LAB */
  .labbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .labbar .selwrap { min-width:140px; }
  .labbar .cap { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); margin-bottom:3px; }
  #v-lab h3 { font-size:13px; margin:26px 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--line); font-weight:650; }
  #v-lab h3 .sub { font-weight:400; color:var(--muted); font-size:11.5px; margin-left:7px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:12px 13px; background:var(--card); }
  .tile .tl { font-size:11px; color:var(--muted); }
  .tile .tv { font-size:22px; font-weight:650; letter-spacing:-.02em; margin-top:2px; }
  .tile .ts { font-size:11px; color:var(--muted); margin-top:1px; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  .legend .lg { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2); }
  .legend .lg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .movers { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  @media (max-width:720px) { .movers { grid-template-columns:1fr; } }
  .mv { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .mv .mk { font-weight:600; }
  .mv .mk .new { font-style:normal; font-size:9px; letter-spacing:.08em; margin-left:6px;
    padding:1px 4px; border:1px solid var(--line); color:var(--muted); }
  .mv .mb { color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .mv .md { font-weight:650; font-variant-numeric:tabular-nums; }
  .mv .mb .cn, .lg2 .cn { color:var(--muted); font-size:11px; }
  .mv .mk .new.gone { border-style:dashed; }
  .cmp { font-size:12.5px; color:var(--ink2); padding:9px 12px; background:var(--wash);
    border-radius:8px; margin-bottom:8px; }
  .cmp .ar { color:var(--muted); margin:0 4px; }
  /* suggestions — reason always shown next to the key, never a bare verdict */
  .sugs { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
  .sug { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); }
  .sug .sk { font-weight:650; font-size:13px; display:flex; align-items:center; gap:6px; }
  .sug .sk .tag { font-style:normal; font-size:9px; letter-spacing:.08em; padding:1px 5px;
    border-radius:3px; border:1px solid var(--line); color:var(--muted); }
  .sug .sk .tag.new { border-color:#1baf7a; color:#0f7f57; }
  .sug .sr { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .sug .sp { font-size:11.5px; color:var(--ink2); margin-top:5px; font-variant-numeric:tabular-nums; }
  /* weekly ledger */
  .lg2 { width:100%; border-collapse:collapse; font-size:12.5px; }
  .lg2 th { text-align:left; font-weight:600; color:var(--muted); font-size:11px;
    padding:6px 8px; border-bottom:1px solid var(--line); }
  .lg2 td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .lg2 .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lg2 .pd { font-weight:600; white-space:nowrap; }
  .lg2 .pd .arch { font-style:normal; font-size:9px; margin-left:5px; padding:1px 4px;
    border:1px dashed var(--line); color:var(--muted); }
  .lg2 .tp { color:var(--ink2); }
  .none { color:var(--muted); font-size:12px; padding:10px 0; }
  .notice { padding:10px 12px; background:var(--wash); border-radius:8px; font-size:12.5px;
    margin-top:16px; }
  .labempty { text-align:center; color:var(--muted); padding:70px 20px; line-height:1.9; }
  .foot { color:var(--muted); font-size:11.5px; line-height:1.7; margin-top:22px;
    padding-top:12px; border-top:1px solid var(--line); }

  /* NEW ARRIVALS feed + BY BRAND — editorial framing over the same catalog data */
  .edhead { display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    margin:6px 0 4px; flex-wrap:wrap; }
  .edhead .kicker { display:block; font-size:10px; text-transform:uppercase;
    letter-spacing:.16em; color:var(--muted); margin-bottom:6px; }
  .edhead h2 { font-size:30px; font-weight:700; letter-spacing:-.03em; margin:0; line-height:1.05; }
  .weektag { font-size:10px; letter-spacing:.12em; border:1px solid var(--ink);
    padding:4px 9px; white-space:nowrap; align-self:center; }
  .weekchips { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 20px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0; }
  .weekchips button { border:0; background:none; padding:5px 10px; font-size:11.5px;
    color:var(--muted); border-radius:999px; }
  .weekchips button b { font-weight:650; }
  .weekchips button.on { background:var(--ink); color:var(--bg); }
  .dayhead { display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--ink);
    padding:24px 0 7px; margin-bottom:2px; }
  .dayhead b { font-size:16px; letter-spacing:-.01em; }
  .dayhead span { color:var(--muted); font-size:12px; }
  .brandsec { margin:14px 0 6px; display:flex; align-items:baseline; gap:8px;
    border-bottom:1px solid var(--line); padding-bottom:6px; }
  .brandsec b { font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .brandsec span { color:var(--muted); font-size:11.5px; }
  .c .thumb.ph { display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:10px; letter-spacing:.08em; }

  .brandwrap { display:grid; grid-template-columns:220px 1fr; gap:22px; align-items:start; }
  @media (max-width:760px) { .brandwrap { grid-template-columns:1fr; } }
  .brail { border:1px solid var(--line); border-radius:11px; background:var(--card);
    overflow:hidden; position:sticky; top:120px; max-height:70vh; overflow-y:auto; }
  .brail button { display:flex; width:100%; justify-content:space-between; gap:8px;
    border:0; border-radius:0; border-bottom:1px solid var(--line); background:none;
    padding:9px 12px; font-size:12.5px; text-align:left; }
  .brail button:last-child { border-bottom:0; }
  .brail button .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .brail button.on { background:var(--ink); color:var(--bg); }
  .brail button.on .n { color:var(--bg); opacity:.7; }
  .bhero { border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
  .bhero h2 { font-size:34px; font-weight:700; letter-spacing:-.03em; margin:0 0 4px; line-height:1; }
  .bhero .bmeta { color:var(--muted); font-size:12px; }
  .bhero .bnew { color:var(--ink); font-weight:650; }
  .catchips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
  .catchips button { border:1px solid var(--line); background:none; border-radius:999px;
    padding:4px 11px; font-size:11.5px; color:var(--ink2); }
  .catchips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* tabs */
  .tabs { display:flex; gap:2px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line); }
  .tab { border:0; border-bottom:2px solid transparent; border-radius:0; background:none;
    padding:10px 14px; color:var(--muted); font-weight:600; }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }

  /* scan lists */
  .lists-head { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .lists-head .spacer { flex:1; }
  .lists-head select { min-width:200px; }
  .runstate { padding:11px 13px; border-radius:9px; background:var(--wash); margin-bottom:14px;
    font-size:13px; }
  .urlrows { display:flex; flex-direction:column; gap:7px; margin-bottom:26px; }
  .ur { display:grid; grid-template-columns:auto 150px 1fr auto; gap:10px; align-items:center;
    padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); }
  .ur.cur { border-color:var(--accent); background:var(--wash); }
  .ur .n { color:var(--muted); font-size:12px; min-width:22px; }
  .ur .bd { font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ur .lb { font-size:12.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ur .lb small { display:block; color:var(--muted); font-size:11px; }
  .ur .x { border:0; background:none; color:var(--muted); padding:2px 6px; }
  .paste { border-top:1px solid var(--line); padding-top:18px; max-width:760px; }
  .paste h3 { font-size:13.5px; margin:0 0 5px; }
  .paste p { color:var(--muted); font-size:12.5px; margin:0 0 9px; line-height:1.6; }
  .paste code { background:var(--line); padding:1px 5px; border-radius:4px; font-size:11.5px; }
  .paste textarea { width:100%; font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--card);
    color:var(--ink); resize:vertical; }
  .paste button { margin-top:9px; }
</style>
</head>
<body>
  <header>
    <div class="top">
      <h1>LAB</h1>
      <span class="stats" id="stats">불러오는 중…</span>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="상품명·원단·색상 검색">
      <select id="brand"><option value="">모든 브랜드</option></select>
      <select id="cat"><option value="">모든 카테고리</option></select>
      <select id="src"><option value="">모든 사이트</option></select>
      <select id="datebasis" title="기간을 무엇으로 셀지 — 수집일(우리가 처음 본 날) 또는 업로드일(쇼핑몰이 올린 날)">
        <option value="added">수집일 기준</option>
        <option value="launch">업로드일 기준</option>
      </select>
      <select id="period" title="기간">
        <option value="">전체 기간</option>
        <option value="7">최근 7일</option>
        <option value="14">최근 14일</option>
        <option value="30">최근 30일</option>
        <option value="thisweek">이번 주</option>
        <option value="lastweek">지난 주</option>
      </select>
      <select id="projf" title="프로젝트 폴더">
        <option value="">모든 상품</option>
      </select>
      <select id="sort">
        <option value="new">최근 수집순</option>
        <option value="priceUp">가격 낮은순</option>
        <option value="priceDown">가격 높은순</option>
        <option value="name">이름순</option>
        <option value="brand">브랜드순</option>
        <option value="launch">업로드일 최신순</option>
      </select>
      <button id="reset">필터 해제</button>
      <select id="tmpl" title="리포트 템플릿">
        <option value="standard">기본 리포트</option>
        <option value="lookbook">비주얼 룩북</option>
        <option value="data">데이터 시트</option>
      </select>
      <button id="report" class="primary" title="지금 보이는 상품으로 리포트 HTML을 만듭니다">📄 리포트 만들기</button>
      <button id="xlsx" title="지금 보이는 상품을 Excel로 내보냅니다 (썸네일 포함)">📊 Excel 내보내기</button>
    </div>
    <div class="selbar" id="selbar">
      <b id="selcount">0개 선택</b>
      <select id="proj"></select>
      <button class="primary" id="addproj">프로젝트에 담기</button>
      <button id="newproj">＋ 새 프로젝트</button>
      <button id="selnone">선택 해제</button>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab on" data-view="lab">LAB</button>
    <button class="tab" data-view="new">신상 피드</button>
    <button class="tab" data-view="brands">브랜드</button>
    <button class="tab" data-view="products">상품</button>
    <button class="tab" data-view="lists">스캔 목록</button>
  </nav>

  <main>
    <div id="v-lab">
      <div class="labbar">
        <div class="selwrap"><span class="cap">기간</span>
          <select id="labmonths">
            <option value="2">최근 8주</option>
            <option value="3">최근 3개월</option>
            <option value="6" selected>최근 6개월</option>
            <option value="12">최근 12개월</option>
          </select></div>
        <div class="selwrap"><span class="cap">단위</span>
          <select id="labgran"><option value="week" selected>주별</option><option value="month">월별</option></select></div>
        <div class="selwrap"><span class="cap">기준</span>
          <select id="labdim">
            <option value="fabric">원단</option>
            <option value="color">색상</option>
            <option value="keyword" selected>키워드</option>
            <option value="brand">브랜드</option>
            <option value="category">카테고리</option>
          </select></div>
      </div>
      <div id="labbody"></div>
    </div>

    <div id="v-new" hidden></div>
    <div id="v-brands" hidden></div>
    <div id="v-products" hidden><div class="grid" id="grid"></div></div>

    <div id="v-lists" hidden>
      <div class="lists-head">
        <select id="listsel"></select>
        <button id="newlist">＋ 새 목록</button>
        <button id="dellist">목록 삭제</button>
        <span class="spacer"></span>
        <button id="runlist" class="primary">▶ 이 목록 전체 스캔</button>
        <button id="stoplist" hidden>■ 중지</button>
      </div>
      <div id="runstate" class="runstate" hidden></div>
      <div class="urlrows" id="urlrows"></div>
      <div class="paste">
        <h3>URL 붙여넣기로 한 번에 추가</h3>
        <p>브랜드 이름을 한 줄에 쓰고, 그 아래에 <code>- 카테고리 : URL</code> 형식으로 나열하세요.
           지금 쓰시는 텍스트 파일을 그대로 붙여넣어도 됩니다.</p>
        <textarea id="bulk" rows="8" placeholder="Aritzia
- ALL NEW : https://www.aritzia.com/intl/en/new
- Tops &amp; Bodysuits : https://www.aritzia.com/intl/en/clothing/tops

Zara
- New : https://www.zara.com/us/en/woman-new-in-l1180.html"></textarea>
        <button id="addbulk" class="primary">목록에 추가</button>
      </div>
    </div>
  </main>
  <script src="exceljs.min.js"></script>
  <script src="excel.js"></script>
  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="report/report.js"></script>
  <script src="report/trend.js"></script>
  <script src="lab.js"></script>
  <script src="report/reportgen.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
