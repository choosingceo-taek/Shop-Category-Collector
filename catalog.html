<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Lens — LAB</title>
<style>
  /* One light room, whatever the browser theme is set to.

     LAB used to follow prefers-color-scheme, so a designer running Chrome in
     dark mode opened a black page while the panel beside it stayed white. This
     is a surface for judging garment photographs and numbers, so the ground is
     fixed white and the language matches the panel exactly: hairlines, squared
     corners, uppercase micro-labels, colour reserved for state. */
  :root {
    color-scheme: light;
    /* Same grouped-list palette as the panel: grey ground, white cards, so a
       long analysis page reads as a stack of separate answers. */
    --bg:#f2f2f7; --card:#fff; --ink:#000; --ink2:#3c3c43; --muted:#8e8e93;
    --line:#e3e3e8; --line2:#d1d1d6; --wash:#f2f2f7;
    --accent:#111; --accent-ink:#fff;
    --sale:#c0392b;
    --r:10px; --r-s:8px;
  }
  * { box-sizing:border-box; }
  /* the hidden attribute must always win — .filters is display:flex, which
     silently overrides the UA's [hidden]{display:none} and left the products
     search bar visible (and dead) on every tab */
  [hidden] { display:none !important; }
  /* on the feed/brand tabs only the search is meaningful — the dropdowns and
     export buttons act on the PRODUCTS grid and would lie anywhere else */
  .filters.slim > .fs:not(:has(#q)) { display:none; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, select, input { font:inherit; border-radius:var(--r-s); border:1px solid var(--line2);
    background:var(--card); color:var(--ink); padding:8px 11px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }

  header { position:sticky; top:0; z-index:5; background:var(--card);
    border-bottom:1px solid var(--line); padding:9px 20px 9px; }
  h1 { letter-spacing:-.02em; }
  .top { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:-.01em; }
  .stats { color:var(--muted); font-size:12.5px; }
  .filters { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; align-items:stretch; }
  .filters input[type=search] { min-width:210px; width:100%; }
  /* a labelled box: the group names itself on its own top border, so a wall
     of nine dropdowns becomes five named jobs */
  .fs { position:relative; display:flex; gap:5px; align-items:center; flex-wrap:wrap;
    background:var(--wash); border:0; border-radius:var(--r-s); padding:5px 9px; }
  .fs.grow { flex:1; min-width:230px; }
  .fs > .lg { position:static; font-size:9px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-right:2px; }
  .fs select, .fs button { font-size:12px; padding:4px 8px; }
  .fs input[type=search] { padding:4px 9px; font-size:12px; }
  .selbar { display:none; align-items:center; gap:10px; margin-top:10px; padding:9px 12px;
    background:var(--wash); border-radius:var(--r); font-size:13px; }
  .selbar.on { display:flex; }

  main { padding:11px 20px 50px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:13px; }
  .c { border:0; border-radius:var(--r); background:var(--card); overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .c.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--wash); }
  .c .thumb { aspect-ratio:3/4; background:var(--line); display:block; width:100%; object-fit:cover; }
  .c .body { padding:9px 10px 11px; display:flex; flex-direction:column; gap:3px; }
  .c .bd { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .c .nm { font-size:12.5px; line-height:1.35; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .c .pr { font-size:12.5px; font-weight:600; }
  .c .pr s { color:var(--muted); font-weight:400; margin-left:5px; }
  .c .pr.sale { color:var(--sale); }
  .c .fb { font-size:11px; color:var(--ink2); }
  .c a { color:inherit; text-decoration:none; }
  .c .pick { position:absolute; top:8px; left:8px; width:20px; height:20px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:70px 20px; line-height:1.8; }
  .gridmore { grid-column:1/-1; display:flex; gap:10px; align-items:center; justify-content:center;
    padding:14px 0 4px; color:var(--muted); font-size:11.5px; }
  .empty b { color:var(--ink); }

  /* LAB */
  /* the view controls are a card of their own, so they sit on the ground the
     same way every analysis below them does */
  .labbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;
    background:var(--card); border-radius:var(--r); padding:7px 12px;
    box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .labbar .selwrap { display:flex; align-items:center; gap:6px; }
  .labbar .cap { font-size:9px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); }
  .labbar select { font-size:12px; padding:4px 8px; }
  /* Each analysis is its own card on the grey ground — the heading belongs to
     the card, so nothing needs a rule under it to say where a section ends. */
  .sec { background:var(--card); border-radius:var(--r); padding:11px 14px 12px;
    margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  #v-lab h3 { font-size:13.5px; margin:0 0 8px; padding:0; border:0;
    font-weight:650; letter-spacing:-.01em; }
  #v-lab h3 .sub { font-weight:400; color:var(--muted); font-size:11.5px; margin-left:7px; }
  /* ---- the four axes, as cards --------------------------------------------
     One card per keyword, because a designer compares keywords side by side
     rather than reading down a column — and a card has room for the shape the
     keyword has traced, and for the search lane under it. Editorial language
     from the Market lens sheet: a rule under an uppercase micro label, figures
     in the corner, no boxes inside boxes. */
  .ax h3 { font:700 10px/1 Helvetica,Arial,sans-serif; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); padding-bottom:8px;
    border-bottom:1px solid var(--ink); margin:0 0 12px; }
  .ax h3 .sub { font-weight:400; letter-spacing:.02em; text-transform:none; font-size:10.5px; }
  .axcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .axc { border:1px solid var(--line); border-radius:var(--r-s); padding:10px 11px 8px;
    display:flex; flex-direction:column; gap:2px; min-width:0; }
  .axch { display:flex; align-items:baseline; gap:8px; }
  .axk { font:700 10px/1.2 Helvetica,Arial,sans-serif; letter-spacing:.11em;
    text-transform:uppercase; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .axd { font:650 10.5px/1 Helvetica,Arial,sans-serif; color:var(--muted);
    font-variant-numeric:tabular-nums; }
  .axd.up { color:#1b7f4d; } .axd.down { color:var(--sale); }
  .axnum { display:flex; align-items:baseline; gap:5px; margin-top:3px; }
  .axnum b { font:650 26px/1 Helvetica,Arial,sans-serif; letter-spacing:-.03em;
    font-variant-numeric:tabular-nums; }
  .axnum i { font-style:normal; font-size:10.5px; color:var(--muted); }
  .axmeta { font-size:10.5px; color:var(--muted); line-height:1.45; min-height:15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .axc svg.area { display:block; width:100%; height:46px; margin-top:6px; }
  .axc .noarea { font-size:10px; color:var(--muted); margin-top:10px; height:46px; }
  /* the search lane — only drawn when a Trends CSV has actually been imported */
  /* the lane sits at the foot of the card, so cards with and without one line
     up rather than staggering the grid */
  .axgt { border-top:1px solid var(--line); margin-top:auto; padding-top:6px; }
  .axgt .gtlab { font:700 8.5px/1 Helvetica,Arial,sans-serif; letter-spacing:.14em;
    color:#8a3c17; }
  .axgt .gtq { font-size:10px; color:var(--muted); margin-left:6px; }
  .axgt .gtv { font:650 11px/1 Helvetica,Arial,sans-serif; float:right;
    font-variant-numeric:tabular-nums; color:#8a3c17; }
  .axgt svg.area { height:26px; margin-top:2px; }
  /* what moved under the numbers — said once, under the cards it qualifies */
  .axcov { font-size:10.5px; color:var(--muted); line-height:1.5; margin-top:10px;
    padding-top:8px; border-top:1px solid var(--line); }
  .labhead { margin:0 0 10px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px; }
  .tile { border:0; border-radius:var(--r); padding:9px 12px; background:var(--card);
    box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .tile .tl { font-size:10.5px; color:var(--muted); }
  .tile .tv { font-size:19px; font-weight:650; letter-spacing:-.02em; margin-top:1px; }
  .tile .ts { font-size:10.5px; color:var(--muted); margin-top:0; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  .legend .lg { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2); }
  .legend .lg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .movers { display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  /* the two standing axes — fabric and design detail — read side by side */
  .axespair { margin-bottom:10px; }
  .axis .axisnow { font-size:12.5px; margin-top:8px; }
  .axis .axismv { font-size:11.5px; color:var(--muted); margin-top:3px; }
  @media (max-width:720px) { .movers { grid-template-columns:1fr; } }
  .mv { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .mv .mk { font-weight:600; }
  .mv .mk .new { font-style:normal; font-size:9px; letter-spacing:.08em; margin-left:6px;
    padding:1px 4px; border:1px solid var(--line); color:var(--muted); }
  .mv .mb { color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .mv .md { font-weight:650; font-variant-numeric:tabular-nums; }
  .mv .mb .cn, .lg2 .cn { color:var(--muted); font-size:11px; }
  .mv .mk .new.gone { border-style:dashed; }
  .cmp { font-size:12.5px; color:var(--ink2); padding:9px 12px; background:var(--wash);
    border-radius:var(--r); margin-bottom:8px; }
  .cmp .ar { color:var(--muted); margin:0 4px; }
  /* What the comparison is standing on. Always shown — a number without its
     basis is the thing that loses a team's trust, and the caveat has to be
     as visible as the figure it qualifies. */
  .cov { font-size:12px; line-height:1.55; color:var(--ink2); padding:9px 12px;
    margin-bottom:10px; border-radius:var(--r); background:#fdf6ec;
    border:1px solid #efdcc0; }
  .cov.same { background:var(--wash); border-color:transparent; color:var(--muted); }
  .cov .covr { margin-top:4px; color:var(--ink2); }
  .cov .covr b { font-weight:650; }
  /* The pulse table: one line per measure. Dense on purpose — the eye runs
     down the change column and stops wherever it is not STABLE. */
  .pulse { width:100%; border-collapse:collapse; font-size:12.5px; }
  .pulse th { text-align:left; font-size:9px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted); font-weight:600; padding:0 8px 5px 0; border-bottom:1px solid var(--line); }
  .pulse th:nth-child(2), .pulse td.pc { width:78px; }
  .pulse th:nth-child(3), .pulse td.ps { width:70px; }
  .pulse th:last-child, .pulse td.pn { width:150px; text-align:right; }
  .pulse td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  .pulse tbody tr:last-child td { border-bottom:0; }
  .pulse tbody tr:hover td { background:var(--wash); }
  .pulse .pk { font-weight:650; }
  .pulse .pc { font-weight:700; font-variant-numeric:tabular-nums; }
  .pulse .pc .up { color:#0ca30c; }
  .pulse .pc .down { color:#d03b3b; }
  .pulse .pc .flat { color:var(--muted); font-size:10px; letter-spacing:.08em; font-weight:600; }
  .pulse .ps { line-height:0; }
  .pulse .ps .nospark { color:var(--line2); line-height:1; font-size:12px; }
  .pulse .pn { color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums;
    white-space:nowrap; }
  .pulse .pn i { font-style:normal; color:var(--line2); }
  @media (max-width:640px) { .pulse th:last-child, .pulse td.pn { display:none; } }
  .pnote { font-size:11px; color:var(--muted); margin:8px 0 0; }
  .rawcmp { margin-top:12px; border-top:1px solid var(--line); padding-top:9px; }
  .rawcmp summary { cursor:pointer; font-size:12px; color:var(--muted); }
  .rawcmp summary:hover { color:var(--ink); }
  .rawcmp .rawnote { font-size:11.5px; color:var(--muted); margin:8px 0 0; }
  /* suggestions — reason always shown next to the key, never a bare verdict */
  .sugs { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
  .sug { border:0; border-radius:var(--r-s); padding:10px 12px; background:var(--wash); }
  .sug .sk { font-weight:650; font-size:13px; display:flex; align-items:center; gap:6px; }
  .sug .sk .tag { font-style:normal; font-size:9px; letter-spacing:.08em; padding:1px 5px;
    border-radius:3px; border:1px solid var(--line); color:var(--muted); }
  .sug .sk .tag.new { border-color:#1baf7a; color:#0f7f57; }
  .sug .sr { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .sug .sp { font-size:11.5px; color:var(--ink2); margin-top:5px; font-variant-numeric:tabular-nums; }
  /* weekly ledger */
  .lg2 { width:100%; border-collapse:collapse; font-size:12.5px; }
  .lg2 th { text-align:left; font-weight:600; color:var(--muted); font-size:11px;
    padding:6px 8px; border-bottom:1px solid var(--line); }
  .lg2 td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .lg2 .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lg2 .pd { font-weight:600; white-space:nowrap; }
  .lg2 .pd .arch { font-style:normal; font-size:9px; margin-left:5px; padding:1px 4px;
    border:1px dashed var(--line); color:var(--muted); }
  .lg2 .tp { color:var(--ink2); }
  /* frequency ranking */
  .rank { display:flex; flex-direction:column; }
  .rk { display:grid; grid-template-columns:26px minmax(90px,180px) 1fr auto; gap:10px;
    align-items:center; padding:5px 0; font-size:12.5px; }
  .rk .ri { color:var(--muted); font-size:11px; text-align:right; font-variant-numeric:tabular-nums; }
  .rk .rn { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rk .rb { background:var(--line); height:8px; border-radius:999px; overflow:hidden; }
  .rk .rb i { display:block; height:100%; background:var(--accent); border-radius:999px; }
  .rk .rc { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:650; }
  .rk .rc em { font-style:normal; font-weight:400; color:var(--muted); margin-left:6px; font-size:11px; }
  .none { color:var(--muted); font-size:12px; padding:10px 0; }
  .notice { padding:10px 12px; background:var(--wash); border-radius:var(--r); font-size:12.5px;
    margin-top:16px; }
  .labempty { text-align:center; color:var(--muted); padding:70px 20px; line-height:1.9; }
  .foot { color:var(--muted); font-size:11.5px; line-height:1.7; margin-top:22px;
    padding-top:12px; border-top:1px solid var(--line); }

  /* NEW ARRIVALS feed + BY BRAND — editorial framing over the same catalog data */
  .edhead { display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    margin:6px 0 4px; flex-wrap:wrap; }
  .edhead .kicker { display:block; font-size:10px; text-transform:uppercase;
    letter-spacing:.16em; color:var(--muted); margin-bottom:6px; }
  .edhead h2 { font-size:30px; font-weight:700; letter-spacing:-.03em; margin:0; line-height:1.05; }
  .weektag { font-size:10px; letter-spacing:.12em; border:1px solid var(--ink);
    padding:4px 9px; white-space:nowrap; align-self:center; }
  .weekchips { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 20px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0; }
  .weekchips button { border:0; background:none; padding:5px 10px; font-size:11.5px;
    color:var(--muted); border-radius:999px; }
  .weekchips button b { font-weight:650; }
  .weekchips button.on { background:var(--ink); color:var(--bg); }
  .dayhead { display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--ink);
    padding:24px 0 7px; margin-bottom:2px; }
  .dayhead b { font-size:16px; letter-spacing:-.01em; }
  .dayhead span { color:var(--muted); font-size:12px; }
  .brandsec { margin:14px 0 6px; display:flex; align-items:baseline; gap:8px;
    border-bottom:1px solid var(--line); padding-bottom:6px; }
  .brandsec b { font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .brandsec span { color:var(--muted); font-size:11.5px; }
  /* A refused photo names the host and the reason. "IMAGE BLOCKED" alone sent
     the same report back three times with nothing anyone could act on. */
  .c .thumb.ph { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:8px; text-align:center;
    color:var(--muted); font-size:9.5px; letter-spacing:.04em; line-height:1.35; }
  .c .thumb.ph b { font-weight:600; color:var(--ink2); word-break:break-all; }
  .c .thumb.ph span { opacity:.8; }
  .checkbox .ccopy, .checkbox .cgrant { font-size:11px; padding:1px 8px; margin-left:6px; }

  .brandwrap { display:grid; grid-template-columns:220px 1fr; gap:22px; align-items:start; }
  @media (max-width:760px) { .brandwrap { grid-template-columns:1fr; } }
  .brail { border:1px solid var(--line); border-radius:var(--r); background:var(--card);
    overflow:hidden; position:sticky; top:120px; max-height:70vh; overflow-y:auto; }
  .brail button { display:flex; width:100%; justify-content:space-between; gap:8px;
    border:0; border-radius:0; border-bottom:1px solid var(--line); background:none;
    padding:9px 12px; font-size:12.5px; text-align:left; }
  .brail button:last-child { border-bottom:0; }
  .brail button .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .brail button.on { background:var(--ink); color:var(--bg); }
  .brail button.on .n { color:var(--bg); opacity:.7; }
  .bhero { border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
  .bhero h2 { font-size:34px; font-weight:700; letter-spacing:-.03em; margin:0 0 4px; line-height:1; }
  .bhero .bmeta { color:var(--muted); font-size:12px; }
  .bhero .bnew { color:var(--ink); font-weight:650; }
  /* ---- the filter rail ---------------------------------------------------
     A column of collapsible questions beside the feed. It stays put while the
     results scroll, because the point of a rail is that the current selection
     is readable at the same time as what it produced. Under 900px it folds
     back above the results — the same groups, no horizontal scrolling. */
  .withrail { display:grid; grid-template-columns:216px minmax(0,1fr); gap:18px; align-items:start; }
  .railmain { min-width:0; }
  .rail { position:sticky; top:8px; max-height:calc(100vh - 24px); overflow-y:auto;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:4px 0; }
  .rail .rgrp { border-bottom:1px solid var(--line); }
  .rail .rgrp:last-child { border-bottom:0; }
  .rail summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;
    padding:9px 11px; font:700 10px/1 Helvetica,Arial,sans-serif; letter-spacing:.13em;
    text-transform:uppercase; color:var(--muted); }
  .rail summary::-webkit-details-marker { display:none; }
  .rail summary:hover { color:var(--ink); }
  .rail summary .rn { margin-left:auto; font-weight:400; letter-spacing:0; font-size:10.5px; }
  .rail summary .rcar { font-size:9px; color:var(--line2); }
  .rail details[open] summary .rcar { transform:rotate(90deg); }
  .rail .rcar { display:inline-block; transition:transform .12s ease; }
  .rail .rvals { padding:0 11px 9px; display:flex; flex-direction:column; gap:1px; }
  .rail label { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink2);
    padding:3px 0; cursor:pointer; min-width:0; }
  .rail label:hover { color:var(--ink); }
  .rail label input { margin:0; width:12px; height:12px; padding:0; flex:none; accent-color:var(--ink); }
  .rail label .rv { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail label .rc { flex:none; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rail label.picked { color:var(--ink); font-weight:600; }
  /* Brands are read by tier, the way the team talks about them, and there are
     too many to scan by eye — so this one group carries a search box. */
  .rail .rsearch { width:100%; font-size:12px; padding:5px 8px; margin:0 0 6px; }
  .rail .rtier { font:700 9px/1 Helvetica,Arial,sans-serif; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:7px 0 3px; }
  .rail .rmore { background:none; border:0; padding:3px 0; font-size:11px; color:var(--muted);
    text-align:left; }
  .rail .rmore:hover { color:var(--ink); text-decoration:underline; }
  .rail .rclear { background:none; border:0; padding:0; font:inherit; font-size:10.5px;
    color:var(--muted); letter-spacing:0; text-transform:none; }
  .rail .rclear:hover { color:var(--sale); }
  /* What is currently narrowing the screen, said once above the results —
     the rail can be scrolled away, and a filtered screen must never look
     like the whole thing. */
  .railnote { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px;
    font-size:11.5px; color:var(--muted); }
  .railnote b { color:var(--ink); font-weight:600; }
  .railnote button { background:none; border:1px solid var(--line); border-radius:999px;
    padding:2px 9px; font-size:11px; color:var(--ink2); }
  @media (max-width:900px) {
    .withrail { grid-template-columns:minmax(0,1fr); }
    .rail { position:static; max-height:none; }
    .rail .rvals { max-height:200px; overflow-y:auto; }
  }
  .catchips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
  .catchips button { border:1px solid var(--line); background:none; border-radius:999px;
    padding:4px 11px; font-size:11.5px; color:var(--ink2); }
  .catchips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tierchips { margin:2px 0 12px; }
  .brail .railgrp { font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); padding:9px 12px 5px; border-bottom:1px solid var(--line);
    background:var(--wash); }
  .bhero h2 .tierbadge { font-style:normal; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; vertical-align:middle; margin-left:9px; padding:3px 8px;
    border:1px solid var(--line); border-radius:999px; color:var(--muted); }

  /* tabs */
  /* The list scope: chips, so how many lists there are and how big each one
     is stays visible without opening anything. Same language as the side
     panel, because it is the same object being chosen. */
  /* SCOPE — which research question this whole screen is about. It rides in
     the title row because it qualifies everything below it, and a band of its
     own was a third horizontal stripe before any content began. */
  /* The scan's own verdict. Colour is used for state only, as everywhere
     else, so this is the one warm mark on the header line. */
  .checkbar { flex-basis:100%; margin-top:6px; }
  /* Warm only when something needs attention — colour stays a state signal, so
     a clean run's chip is as quiet as the rest of the header. */
  button#checkchip.warn { border-color:#c9873f; background:#fdf6ec; color:#8a5a1e; }
  .checkbox .grp { display:block; margin:7px 0 3px; font-size:9.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); }
  .checkbox .grp:first-child { margin-top:0; }
  .checkbox .cw .num { color:var(--muted); font-variant-numeric:tabular-nums; }
  .checkbox { margin-top:6px; border:1px solid var(--line); background:var(--card);
    padding:8px 10px; font-size:11.5px; line-height:1.55; max-height:210px; overflow:auto; }
  .checkbox .cw { display:block; padding:3px 0; border-bottom:1px solid var(--line); }
  .checkbox .cw:last-child { border-bottom:0; }
  .checkbox .cw b { font-weight:600; }
  .checkbox .cw a { color:var(--muted); text-decoration:none; margin-left:6px; }
  .checkbox .cwhen { color:var(--muted); display:block; margin-bottom:5px; }
  /* What the analysis is reading. It is a subset by design, so it says so —
     a figure computed from a quarter of the catalog must never be mistaken
     for one about all of it. */
  .srcnote { margin:0 0 12px; color:var(--muted); font-size:11.5px; line-height:1.5; }
  /* Who is being read, and what that amounts to — one line, not three bands. */
  .labctx { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin:0 0 10px; }
  .labctx .catchips { margin:0; }
  .labctx .srcnote { margin:0; flex:1 1 240px; min-width:0; }
  .labctx:empty { display:none; }
  .scoperail { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .scoperail .cap { color:var(--muted); }
  .scopechips { display:flex; gap:5px; flex-wrap:wrap; }
  .scopechips button { display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line2); background:var(--card); color:var(--ink2);
    border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .scopechips button:hover { border-color:var(--ink); color:var(--ink); }
  .scopechips button .n { font-size:11px; font-weight:700; color:var(--muted); }
  .scopechips button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .scopechips button.on .n { color:rgba(255,255,255,.7); }
  .scopechips button .dot { width:8px; height:8px; border-radius:50%; }
  /* One line. The subtitle told you what you would find on arrival — useful
     the first day, a paragraph to skip every day after. */
  .tabs { display:flex; gap:3px; padding:7px 20px 8px; background:var(--card);
    border-bottom:1px solid var(--line); }
  .tab { display:flex; align-items:center; gap:7px; border:0; border-radius:var(--r-s);
    background:var(--wash); padding:6px 12px; color:var(--ink2); font-weight:600;
    font-size:13px; }
  .tab .ti { font-size:14px; line-height:1; }
  .tab .tt { display:flex; align-items:center; line-height:1.2; text-align:left; }
  .tab .tt i { display:none; }
  .tab.on { background:var(--ink); color:#fff; }
  .tab.on .tt i { color:rgba(255,255,255,.65); }

  /* scan lists */
  .lists-head { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .lists-head .spacer { flex:1; }
  .lists-head select { min-width:200px; }
  .runstate { padding:11px 13px; border-radius:var(--r); background:var(--wash); margin-bottom:14px;
    font-size:13px; }
  .urlrows { display:flex; flex-direction:column; gap:7px; margin-bottom:26px; }
  .ur { display:grid; grid-template-columns:auto 150px 1fr auto; gap:10px; align-items:center;
    padding:9px 11px; border:1px solid var(--line); border-radius:var(--r); background:var(--card); }
  .ur.cur { border-color:var(--accent); background:var(--wash); }
  .ur .n { color:var(--muted); font-size:12px; min-width:22px; }
  .ur .bd { font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ur .lb { font-size:12.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ur .lb small { display:block; color:var(--muted); font-size:11px; }
  .ur .x { border:0; background:none; color:var(--muted); padding:2px 6px; }
  .paste { border-top:1px solid var(--line); padding-top:18px; max-width:760px; }
  .paste h3 { font-size:13.5px; margin:0 0 5px; }
  .paste p { color:var(--muted); font-size:12.5px; margin:0 0 9px; line-height:1.6; }
  .paste code { background:var(--line); padding:1px 5px; border-radius:4px; font-size:11.5px; }
  .paste textarea { width:100%; font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; background:var(--card);
    color:var(--ink); resize:vertical; }
  .paste button { margin-top:9px; }
</style>
</head>
<body>
  <header>
    <!-- Title, scope and tally on one line: all three answer the same
         question — what am I looking at — and each had a band of its own. -->
    <div class="top">
      <h1>LAB</h1>
      <div class="scoperail" id="scoperail" hidden>
        <span class="cap">Scope</span>
        <div class="scopechips" id="scopechips"></div>
      </div>
      <span class="stats" id="stats">Loading…</span>
      <!-- What the catalog weighs, and the one way to make it smaller. The
           weekly snapshots keep the trend after products are pruned, so this
           is a working-set control rather than a delete-your-history button.
           It rides the line that is already here. -->
      <button class="datachip" id="datachip" title="What this catalog is holding">·</button>
      <!-- Opened from the chip, closed by default, so it costs no height until
           someone asks. Everything here is about the catalog as a whole, which
           is why it sits by the size and not in the products toolbar. -->
      <div class="databox" id="databox" hidden>
        <span id="datafacts"></span>
        <button id="datatrim">Free up space…</button>
        <button id="dataout">Back up (.json)</button>
        <button id="datain">Merge in a backup…</button>
        <input type="file" id="datafile" accept=".json,application/json" hidden>
        <!-- Search interest. There is no public Google Trends API and a rank
             cannot be collected retroactively, so the accurate road is the
             CSV that trends.google.com exports. Until one is imported the
             search lane on the cards simply is not drawn. -->
        <button id="gtin">Add Google Trends (.csv)…</button>
        <input type="file" id="gtfile" accept=".csv,text/csv" hidden>
      </div>
      <!-- What the scans think of their own results.

           Every problem in this file's history reached the designer the same
           way: they opened the LAB, saw something wrong, and said so. The scan
           already graded itself — but the grade went to a console command, so
           it might as well not have existed. This is the same grade, on the
           screen they were going to open anyway.

           It shows BOTH halves now. "Which sites give good information and
           which do not" is the question a designer actually asks before
           trusting a week's numbers, and a band that only ever listed failures
           could answer half of it. The chip rides this line, so the list costs
           no height until it is opened. -->
      <button class="datachip" id="checkchip" title="What each scanned site produced" hidden><span id="checkn"></span></button>
      <div class="checkbar" id="checkbar" hidden>
        <div class="checkbox" id="checkbox" hidden></div>
      </div>
    </div>
    <div class="filters">
      <!-- Grouped by what each control does, not by what fits on the line:
           find it, narrow it, choose the window, order it, take it away.
           Each group names itself on its own border, as in the panel. -->
      <div class="fs grow"><span class="lg">Find</span>
        <input type="search" id="q" placeholder="Search name · fabric · colour">
      </div>
      <div class="fs"><span class="lg">Narrow</span>
        <select id="brand"><option value="">All brands</option></select>
        <select id="cat"><option value="">All categories</option></select>
        <select id="src"><option value="">All sites</option></select>
        <select id="projf" title="Project folder">
          <option value="">All products</option>
        </select>
      </div>
      <!-- One measure of time: when a row was first collected. The shop's own
           publish date is collected but not shown — only Shopify states one,
           so it was blank for most brands, and it means "made visible in the
           store", which is why a re-listed item read as new and a long-listed
           one read as 2025. -->
      <div class="fs"><span class="lg">Period</span>
        <select id="period" title="Period">
          <option value="">All time</option>
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="thisweek">This week</option>
          <option value="lastweek">Last week</option>
        </select>
      </div>
      <div class="fs"><span class="lg">Order</span>
        <select id="sort">
          <option value="new">Newest collected</option>
          <option value="priceUp">Price low to high</option>
          <option value="priceDown">Price high to low</option>
          <option value="name">Name</option>
          <option value="brand">Brand</option>
        </select>
        <button id="reset">Clear filters</button>
      </div>
      <div class="fs"><span class="lg">Take away</span>
        <select id="tmpl" title="Report template">
          <option value="standard">Dashboard</option>
          <option value="lookbook">Lookbook</option>
          <option value="data">Data sheet</option>
        </select>
        <button id="report" class="primary" title="Build a report HTML from the products shown">Build report</button>
        <button id="xlsx" title="Export the products shown to Excel (thumbnails included)">Export Excel</button>
      </div>
    </div>
    <div class="selbar" id="selbar">
      <b id="selcount">0 selected</b>
      <select id="proj"></select>
      <button class="primary" id="addproj">Add to project</button>
      <button id="newproj">＋ New project</button>
      <button id="selnone">Clear selection</button>
    </div>
  </header>
  <!-- Each tab says what it IS before you click it: icon, name, and the
       one-line answer to "what will I see there". -->
  <nav class="tabs">
    <button class="tab on" data-view="lab"><span class="ti">📈</span>
      <span class="tt">LAB<i>Weekly trends</i></span></button>
    <button class="tab" data-view="new"><span class="ti">🆕</span>
      <span class="tt">New In<i>Arrivals by week</i></span></button>
    <button class="tab" data-view="brands"><span class="ti">🏷️</span>
      <span class="tt">By Brand<i>Browse each brand</i></span></button>
    <button class="tab" data-view="products"><span class="ti">🧺</span>
      <span class="tt">Products<i>Everything collected</i></span></button>
    <button class="tab" data-view="lists"><span class="ti">🗂️</span>
      <span class="tt">Scan lists<i>Collection history</i></span></button>
  </nav>

  <main>
    <div id="v-lab">
      <div class="labbar">
        <div class="selwrap"><span class="cap">Period</span>
          <select id="labmonths">
            <option value="2">Last 8 weeks</option>
            <option value="3">Last 3 months</option>
            <option value="6" selected>Last 6 months</option>
            <option value="12">Last 12 months</option>
          </select></div>
        <div class="selwrap"><span class="cap">Interval</span>
          <select id="labgran"><option value="week" selected>Weekly</option><option value="month">Monthly</option></select></div>
        <!-- No measure picker: the axes are the four a designer asks of a
             season — FABRIC / COLOUR / FIT / DETAIL — and they are all on
             screen at once. Choosing one at a time meant holding the other
             three in your head. -->
      </div>
      <div id="labbody"></div>
    </div>

    <!-- One rail, seven questions, both browsing tabs.

         Chips above a feed can only narrow by one thing at a time, and the
         designer's question is compound: midi dresses, in satin, at the
         contemporary brands. Each group is one question, several answers
         inside a group are an "or", and the groups are an "and" — the shape
         every filter rail in the trade already has. The counts beside each
         value are computed against the OTHER groups, so nothing on the rail
         can lead to an empty screen. -->
    <div class="withrail" id="railwrap" hidden>
      <aside class="rail" id="rail"></aside>
      <div class="railmain">
        <div id="v-new" hidden></div>
        <div id="v-brands" hidden></div>
      </div>
    </div>
    <div id="v-products" hidden><div class="grid" id="grid"></div></div>

    <div id="v-lists" hidden>
      <div class="lists-head">
        <select id="listsel"></select>
        <button id="newlist">＋ New list</button>
        <button id="dellist">Delete list</button>
        <span class="spacer"></span>
        <button id="runlist" class="primary">▶ Scan this list</button>
        <button id="stoplist" hidden>■ Stop</button>
      </div>
      <div id="runstate" class="runstate" hidden></div>
      <div class="urlrows" id="urlrows"></div>
      <div class="paste">
        <h3>Paste URLs to add in bulk</h3>
        <p>Put a brand on its own line, then list <code>- Category : URL</code> underneath.
           You can paste the text file you already keep, as it is.</p>
        <textarea id="bulk" rows="8" placeholder="Aritzia
- ALL NEW : https://www.aritzia.com/intl/en/new
- Tops &amp; Bodysuits : https://www.aritzia.com/intl/en/clothing/tops

Zara
- New : https://www.zara.com/us/en/woman-new-in-l1180.html"></textarea>
        <button id="addbulk" class="primary">Add to list</button>
      </div>
    </div>
  </main>
  <script src="exceljs.min.js"></script>
  <script src="excel.js"></script>
  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="report/report.js"></script>
  <script src="report/trend.js"></script>
  <script src="lab.js"></script>
  <script src="report/reportgen.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
