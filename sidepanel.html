<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Lens</title>
<style>
  /* Warm paper, serif display, soft cards, black pill actions.

     The reference the team supplied reads as a printed page rather than an
     app chrome: a cream ground, a serif headline, rounded cards floating on
     it, and one solid black control per screen. Borrowed as SENSIBILITY, not
     as a copy — the layout stays ours, built around the one job (collecting
     reference URLs while browsing).

     Why it suits this tool: the panel sits open all day beside shop pages that
     are themselves loud and white. A warm ground separates "my workspace" from
     "the site I'm looking at", and reserving pure black for actions makes the
     next step obvious at a glance. */
  :root {
    color-scheme: light dark;
    --bg:#f6f1e6; --card:#fffdf8; --ink:#1b1813; --ink2:#4d463c; --muted:#8d8574;
    --line:#e4dac5; --hard:#1b1813; --wash:#efe8d8; --overlay:rgba(20,17,13,.58);
    /* one warm accent, spent on emphasis only (streak/flame in the reference) */
    --accent:#d2691e; --accent2:#f0a04b;
    --serif: ui-serif, Georgia, "Times New Roman", "Apple SD Gothic Neo", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17140f; --card:#221e17; --ink:#f3eee1; --ink2:#cdc5b4; --muted:#8f8878;
      --line:#332d22; --hard:#f3eee1; --wash:#1e1a14; --overlay:rgba(0,0,0,.62);
      --accent:#e8a33d; --accent2:#f0c07a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.5 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  button, select, input { font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:7px 12px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--hard); }
  button:disabled { opacity:.4; cursor:default; }
  .solid { background:var(--hard); color:var(--bg); border-color:var(--hard); font-weight:650; }
  textarea, input[type=search] { border-radius:12px; }
  .cap { text-transform:uppercase; letter-spacing:.1em; font-size:10px; }
  .row { display:flex; gap:6px; align-items:center; }
  .grow { flex:1; min-width:0; }

  header { padding:12px 14px 0; border-bottom:1px solid var(--line); background:var(--bg); }
  .brandline { display:flex; align-items:center; gap:8px; }
  .lens { width:20px; height:20px; flex:none; color:var(--ink); display:block; }
  .lens svg { width:100%; height:100%; display:block; }
  .lens.busy { color:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  /* readable by screen readers, invisible on screen */
  .sronly { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  h1 { font-size:13px; margin:0; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
  .tabs { display:flex; gap:18px; margin-top:11px; }
  .tab { border:0; background:none; padding:0 0 9px; font-size:10.5px; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    border-bottom:2px solid transparent; }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }

  main { flex:1; overflow:hidden; display:flex; flex-direction:column; }
  .view { flex:1; overflow-y:auto; display:none; flex-direction:column; }
  .view.on { display:flex; }

  /* ---------- COLLECTOR: add the page you're on, curate the list ---------- */
  .adder { padding:13px 14px 4px; }
  .now { font-size:11.5px; color:var(--ink2); margin-bottom:10px; line-height:1.5; }
  .now .host { font-weight:700; color:var(--ink); }
  .now .badge { display:inline-block; margin-left:6px; padding:1px 6px; font-size:9px;
    letter-spacing:.09em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); }
  .now .badge.ok { border-color:var(--hard); color:var(--ink); }
  #addbtn { width:100%; padding:12px; letter-spacing:.08em; text-transform:uppercase;
    font-size:11px; font-weight:700; }
  .addrow { display:flex; gap:6px; margin-top:6px; }
  .addrow button { flex:1; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:6px; }

  .listwrap { padding:4px 14px 18px; }
  /* soft card blocks floating on the warm ground, as in the reference */
  .panelcard { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 13px; margin-bottom:10px; }
  .panelcard > .cap { display:block; color:var(--muted); margin-bottom:8px; }
  .lhead { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  .lhead select { flex:1; min-width:0; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    border-radius:12px; }
  .iconbtn { width:30px; height:30px; padding:0; display:inline-flex; align-items:center;
    justify-content:center; flex:none; font-size:13px; border-radius:50%; }
  .runrow { display:flex; gap:6px; margin-bottom:8px; }
  .upnote { border:1px solid rgba(80,200,120,.45); border-radius:10px; padding:10px 12px;
    margin-bottom:10px; font-size:12px; line-height:1.55; }
  .upnote .uphow { color:var(--muted); font-size:11px; margin:3px 0 8px; }
  .upnote button { width:100%; font-size:11px; font-weight:700; letter-spacing:.05em; }
  .explist { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .explist .cap { color:var(--muted); flex:1; }
  .explist button { font-size:10.5px; padding:4px 9px; letter-spacing:.05em; }
  .runctl { display:flex; gap:6px; margin-bottom:10px; }
  .runctl button { flex:1; font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; }
  .runctl .danger { color:#b4462f; border-color:rgba(180,70,47,.35); }
  @media (prefers-color-scheme: dark) { .runctl .danger { color:#ff9a7a; } }
  /* LAB — the destination. On a cream ground the strongest mark available is
     solid ink, which is also what the reference reserves for its one action. */
  .labbtn { display:block; width:100%; text-align:left; margin:10px 14px 12px;
    width:calc(100% - 28px); padding:15px 17px; border:0; border-radius:18px;
    background:var(--hard); color:var(--bg); }
  .labbtn:hover { background:#000; }
  @media (prefers-color-scheme: dark) { .labbtn:hover { background:#fff; } }
  .labbtn .lbmain { display:flex; align-items:center; justify-content:space-between;
    font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:.02em; }
  .labbtn .lbgo { font-size:16px; color:var(--accent2); }
  .labbtn .lbsub { display:block; font-size:11px; opacity:.72; margin-top:3px; }
  .capline { display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:11px; color:var(--muted); margin-bottom:12px; }
  .capline select { width:auto; flex:0 0 auto; font-size:11px; padding:3px 6px; }
  .runrow button { flex:1; font-size:10.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; padding:11px; }
  .qstate { padding:9px 11px; background:var(--wash); font-size:11.5px; margin-bottom:11px;
    border-radius:12px; border-left:3px solid var(--accent); }
  .result { padding:11px 12px; background:var(--wash); margin-bottom:12px; font-size:11.5px;
    border-radius:14px; }
  .result b { font-weight:700; }
  .result button { font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:6px; }

  .grp { margin-bottom:14px; }
  .grp .gname { display:flex; align-items:baseline; gap:6px; font-size:9.5px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.12em; padding:0 2px 6px; margin-bottom:4px; }
  .grp .gn { color:var(--muted); }
  .ent { display:flex; align-items:center; gap:8px; padding:9px 10px; margin-bottom:4px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .ent.cur { background:var(--wash); border-color:var(--accent); }
  .ent.done { opacity:.42; }
  .ent .txt { flex:1; min-width:0; }
  .ent .lb { font-size:12px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ent .u { font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; display:block; }
  .ent .tag { font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:1px 6px; flex:none; }
  .ent .act { border:0; background:none; color:var(--muted); padding:2px 4px; font-size:11px; flex:none; }
  .ent .act:hover { color:var(--ink); }
  .lempty { color:var(--muted); font-size:12px; line-height:1.8; padding:22px 0; text-align:center; }

  .paste { border-top:1px solid var(--line); padding:12px 14px 20px; }
  .paste .cap { color:var(--muted); display:block; margin-bottom:6px; }
  .paste textarea { width:100%; font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line); padding:8px 9px; background:var(--bg); color:var(--ink);
    resize:vertical; }
  .paste button { margin-top:6px; width:100%; font-size:10px; letter-spacing:.09em;
    text-transform:uppercase; padding:7px; }
  .paste .hint { font-size:10.5px; color:var(--muted); line-height:1.55; margin-top:6px; }

  .live { padding:9px 14px; font-size:11.5px;
    color:var(--ink2); display:none; }
  .live.on { display:block; }
  .bar { height:2px; background:var(--line); margin-top:7px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:30%;
    animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

  /* ---------- PRODUCTS: what the scans collected ---------- */
  .filters { padding:11px 14px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; }
  .filters input[type=search] { width:100%; text-transform:uppercase; font-size:10.5px; letter-spacing:.06em; }
  .scopebar { display:flex; align-items:center; gap:8px; padding:6px 9px; background:var(--wash);
    border-left:2px solid var(--hard); font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; font-weight:700; }
  .scopebar button { border:0; background:none; color:var(--muted); padding:0 2px; font-size:11px; }
  .selwrap { flex:1; min-width:0; }
  .selwrap .cap { display:block; color:var(--muted); margin-bottom:3px; }
  .selwrap select { width:100%; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px; }
  .pc { position:relative; background:var(--wash); margin:0; border-radius:14px; overflow:hidden; }
  .pc img, .pc .ph { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--wash); }
  .pc figcaption { position:absolute; left:0; right:0; bottom:0; padding:20px 8px 7px;
    background:linear-gradient(transparent, var(--overlay)); color:#fff;
    display:flex; flex-direction:column; gap:1px; }
  .pc .b { font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .pc .n { font-size:10px; line-height:1.3; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .pc .p { font-size:11px; font-weight:700; }
  .pc .p s { font-weight:400; opacity:.7; margin-left:4px; }
  .pc .ck { position:absolute; top:7px; right:7px; width:16px; height:16px; margin:0;
    appearance:none; background:#fff; border:1px solid #111; cursor:pointer; }
  .pc .ck:checked { background:#111; }
  .pc .ck:checked::after { content:"✓"; color:#fff; font-size:10px; display:flex;
    align-items:center; justify-content:center; height:100%; }
  .pc.sel { outline:2px solid var(--hard); outline-offset:-2px; }
  .pempty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 18px;
    font-size:12px; line-height:1.8; }
  .selbar { border-top:1px solid var(--hard); padding:9px 14px; display:none;
    align-items:center; gap:8px; background:var(--bg); }
  .selbar.on { display:flex; }
  .selbar .cnt { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .cir { width:34px; height:34px; border-radius:50%; padding:0; display:inline-flex;
    align-items:center; justify-content:center; font-size:12px; border:1px solid var(--hard); }
  .cir.txt { font-size:9px; font-weight:700; letter-spacing:.05em; }

  /* in-panel prompt/confirm */
  .ask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
    align-items:center; justify-content:center; padding:18px; z-index:20; }
  .ask[hidden] { display:none; }
  .askbox { background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; width:100%; max-width:320px; }
  .asktext { font-size:12.5px; line-height:1.55; margin-bottom:10px; }
  #askinput { width:100%; margin-bottom:10px; }
  .askrow { display:flex; gap:6px; }
  .askrow button { flex:1; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    font-weight:700; padding:8px; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:16px;
    background:var(--hard); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:11.5px;
    opacity:0; transition:opacity .18s; pointer-events:none; z-index:9; }
  .toast.on { opacity:.97; }
</style>
</head>
<body>
  <header>
    <div class="brandline">
      <!-- The wordmark is gone: Chrome already prints the extension name in the
           side panel's own title bar, so repeating it spent the top of a narrow
           panel saying what the user just read. The lens doubles as the status
           light — it fills and pulses while a scan runs. -->
      <span class="lens" id="dot" title="Market Lens">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
          <path d="M15.4 15.4 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <h1 class="sronly">Market Lens</h1>
    </div>
    <div class="tabs">
      <button class="tab on" data-view="collector">Collector</button>
      <button class="tab" data-view="products">Products</button>
    </div>
  </header>

  <main>
    <!-- COLLECTOR — add whatever page you're on, then curate the list -->
    <section class="view on" id="v-collector">
      <div class="adder">
        <div class="upnote" id="upnote" hidden>
          <div><b>새 버전 <span id="upver"></span></b>이 나왔습니다 (현재 <span id="upcur"></span>)</div>
          <div class="uphow">ZIP을 받아 기존 폴더에 덮어쓰고, 확장 ↻ 리로드 → 탭 F5 하면 됩니다.</div>
          <button id="upget">⬇ 새 버전 ZIP 받기</button>
        </div>
        <div class="now" id="now">페이지를 읽는 중…</div>
        <button id="addbtn" class="solid">＋ Add this page</button>
      </div>

      <!-- LAB is where the collected work becomes an answer, so it is the
           loudest thing on the panel, not a button among buttons -->
      <button id="catalog" class="labbtn">
        <span class="lbmain">LAB<span class="lbgo">→</span></span>
        <span class="lbsub">주차별 신상 · 브랜드별 · 트렌드 분석</span>
      </button>

      <div class="live" id="live"><span id="livetext"></span><div class="bar"><i></i></div></div>

      <div class="listwrap">
        <!-- list + its controls read as one card floating on the warm ground -->
        <div class="panelcard">
        <div class="lhead">
          <select id="listsel" title="리스트 선택"></select>
          <button class="iconbtn" id="newlist" title="새 리스트">＋</button>
          <button class="iconbtn" id="renlist" title="리스트 이름 변경">✎</button>
          <button class="iconbtn" id="dellist" title="리스트 삭제">🗑</button>
        </div>
        <div class="explist">
          <span class="cap">목록 내보내기</span>
          <button id="explisttxt" title="메모장에서 편집하고 다시 Import하면 목록이 갱신됩니다">.txt</button>
          <button id="explistxlsx" title="Excel에서 편집하고 다시 Import하면 목록이 갱신됩니다">.xlsx</button>
        </div>
        <div class="qstate" id="qstate" hidden></div>
        <!-- one fixed set of controls, always in the same place: the state
             lives in enabled/disabled, not in buttons appearing and vanishing -->
        <div class="runrow">
          <button id="runlist" class="solid">▶ Scan all</button>
        </div>
        <div class="runctl">
          <button id="jpause">⏸ Pause</button>
          <button id="jreset" class="danger" title="실행을 중지하고 목록 실행 상태를 초기화합니다">↺ Reset</button>
        </div>
        <label class="capline" for="maxitems">URL당 최대 상품 수
          <select id="maxitems" title="한 URL에서 가져올 상품 수 상한">
            <option value="30">30개</option>
            <option value="60" selected>60개 (기본)</option>
            <option value="100">100개</option>
            <option value="200">200개</option>
            <option value="0">제한 없음</option>
          </select>
        </label>
        </div>
        <div class="result" id="listresult" hidden>
          <span id="resulttext"></span>
          <div class="row" style="margin-top:7px">
            <button id="listxlsx" class="grow">⬇ Excel</button>
            <button id="listview" class="grow">View</button>
          </div>
        </div>
        <div id="listbody"></div>
      </div>

      <div class="paste">
        <span class="cap">Import</span>
        <button id="importbtn">파일에서 가져오기 (.xlsx · .csv · .txt)</button>
        <input type="file" id="importfile" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden>
        <div class="hint">브랜드 · 카테고리 · URL 열이 있으면 알아서 인식합니다.
          열 이름이 없어도 URL이 있는 줄은 모두 읽습니다.</div>
        <span class="cap" style="margin-top:12px">Paste URLs</span>
        <textarea id="bulk" rows="4" placeholder="Zara
- Dresses : https://www.zara.com/us/en/woman-dresses-l1066.html"></textarea>
        <button id="addbulk">Add to list</button>
      </div>
    </section>

    <!-- PRODUCTS — what the scans collected -->
    <section class="view" id="v-products">
      <div class="filters">
        <div class="scopebar" id="scopebar" hidden>
          <span id="scopetext"></span>
          <button id="scopeclear" title="전체 보기">✕</button>
        </div>
        <input id="psearch" type="search" placeholder="Search products">
        <div class="row">
          <div class="selwrap"><span class="cap">Brand</span>
            <select id="pbrand"><option value="">All</option></select></div>
          <div class="selwrap"><span class="cap">Category</span>
            <select id="pcat"><option value="">All</option></select></div>
        </div>
      </div>
      <div class="pgrid" id="pgrid"></div>
    </section>
  </main>

  <div class="selbar" id="selbar">
    <span class="cnt" id="selcount">Selected 0</span>
    <span style="flex:1"></span>
    <button class="cir txt" id="selall" title="보이는 상품 전체 선택">ALL</button>
    <button class="cir" id="selreset" title="선택 해제">↺</button>
    <button class="cir" id="selexport" title="선택한 상품 Excel 내보내기">⬆</button>
  </div>

  <!-- Chrome side panels do not display window.confirm/prompt/alert, so asking
       anything has to happen inside the panel itself. -->
  <div class="ask" id="ask" hidden>
    <div class="askbox">
      <div class="asktext" id="asktext"></div>
      <input id="askinput" type="text" hidden>
      <div class="askrow">
        <button id="askcancel">취소</button>
        <button id="askok" class="solid">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="exceljs.min.js"></script>
  <script src="excel.js"></script>
  <script src="sites.js"></script>
  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
