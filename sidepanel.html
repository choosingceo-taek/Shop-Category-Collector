<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리서치 컴패니언</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:rgba(11,11,11,.11); --accent:#2a78d6; --accent-ink:#fff;
    --good:#0ca30c; --wash:rgba(42,120,214,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0d; --card:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
      --line:rgba(255,255,255,.12); --accent:#3987e5; --wash:rgba(57,135,229,.12); }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:13.5px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  button, select, input { font:inherit; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); padding:8px 11px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }
  .row { display:flex; gap:6px; align-items:center; }
  .grow { flex:1; min-width:0; }

  header { padding:11px 13px; border-bottom:1px solid var(--line); background:var(--card); }
  .brandline { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; }
  .dot.busy { background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  .dot.idle { background:var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  h1 { font-size:13.5px; margin:0; font-weight:650; letter-spacing:-.01em; }

  /* the agent's read of the page + what it suggests doing */
  .say { padding:12px 13px; border-bottom:1px solid var(--line); background:var(--wash); }
  .say .obs { font-size:12.5px; color:var(--ink2); margin-bottom:9px; }
  .say .obs b { color:var(--ink); font-weight:600; }
  .say .sub { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; }
  .say .cta { width:100%; }
  .say .alt { margin-top:6px; width:100%; }

  .live { padding:9px 13px; border-bottom:1px solid var(--line); background:var(--card);
    font-size:12px; color:var(--ink2); display:none; }
  .live.on { display:block; }
  .bar { height:3px; border-radius:2px; background:var(--line); margin-top:7px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:30%;
    animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

  /* scan list — the visual list of curated brand categories */
  .listsec { border-bottom:1px solid var(--line); background:var(--card); padding:10px 13px 12px; }
  .lhead { display:flex; align-items:center; gap:7px; font-size:12.5px; margin-bottom:8px; }
  .lcount { color:var(--muted); font-size:11.5px; }
  .mini { padding:4px 9px; font-size:11.5px; border-radius:7px; }
  .qstate { padding:8px 10px; border-radius:8px; background:var(--wash); font-size:12px; margin-bottom:8px; }
  .listbody { display:flex; flex-direction:column; gap:8px; max-height:34vh; overflow-y:auto; }
  .bgroup .bname { font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:inline-flex; align-items:center; gap:5px; max-width:100%;
    border:1px solid var(--line); border-radius:999px; padding:3px 9px;
    font-size:11.5px; background:var(--bg); }
  .chip.cur { border-color:var(--accent); background:var(--wash); }
  .chip.done { opacity:.55; }
  .chip a { color:inherit; text-decoration:none; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:150px; }
  .chip a:hover { text-decoration:underline; }
  .chip .cx { border:0; background:none; color:var(--muted); padding:0 1px; cursor:pointer; font-size:11px; }
  .lempty { color:var(--muted); font-size:12px; line-height:1.6; }

  .tools { padding:9px 13px; border-bottom:1px solid var(--line); background:var(--card); }
  .colrow { margin-bottom:0; }
  #tray { flex:1; overflow-y:auto; padding:10px 13px 22px; }
  .count { font-size:11.5px; color:var(--muted); padding:9px 13px 0; }
  .it { display:grid; grid-template-columns:44px 1fr auto; gap:9px; align-items:start;
    padding:8px; border:1px solid var(--line); border-radius:9px; background:var(--card); margin-bottom:7px; }
  .it img, .it .ph { width:44px; height:58px; object-fit:cover; border-radius:5px; background:var(--line); display:block; }
  .it .n { font-size:12.5px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .it .m { font-size:11px; color:var(--muted); margin-top:2px; }
  .it .f { font-size:11px; color:var(--ink2); margin-top:2px; }
  .it .x { border:0; background:none; color:var(--muted); padding:2px 5px; }
  .it a { color:inherit; text-decoration:none; }
  .it a:hover .n { text-decoration:underline; }
  .empty { color:var(--muted); text-align:center; padding:30px 14px; font-size:12.5px; line-height:1.7; }
  .tag { font-size:10.5px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; background:var(--ink);
    color:var(--bg); padding:7px 14px; border-radius:999px; font-size:12px; opacity:0;
    transition:opacity .18s; pointer-events:none; z-index:9; }
  .toast.on { opacity:.95; }
</style>
</head>
<body>
  <header>
    <div class="brandline"><span class="dot idle" id="dot"></span><h1>리서치 컴패니언</h1></div>
    <div class="row colrow">
      <select id="col" class="grow" title="컬렉션"></select>
      <button id="newcol" title="새 컬렉션">＋</button>
    </div>
  </header>

  <!-- what the agent sees, and the one thing it suggests -->
  <section class="say">
    <div class="obs" id="obs">페이지를 읽는 중…</div>
    <button class="primary cta" id="cta" disabled>확인 중</button>
    <button class="alt" id="alt" hidden></button>
  </section>

  <div class="live" id="live"><span id="livetext"></span><div class="bar"><i></i></div></div>

  <!-- the scan list: the brand/category URLs this user curates and re-runs -->
  <section class="listsec">
    <div class="lhead">
      <b>내 스캔 목록</b>
      <span class="lcount" id="lcount"></span>
      <span style="flex:1"></span>
      <button id="runlist" class="mini primary" title="목록의 모든 카테고리를 순서대로 전체 스캔">▶ 전체 스캔</button>
      <button id="stoplist" class="mini" hidden>■ 중지</button>
    </div>
    <div class="qstate" id="qstate" hidden></div>
    <div id="listbody" class="listbody"></div>
  </section>

  <div class="tools row">
    <button id="catalog" class="primary grow">📁 카탈로그 열기</button>
    <button id="export" title="이 컬렉션 내보내기">내보내기</button>
    <button id="clear" title="이 컬렉션 비우기">비우기</button>
  </div>

  <div class="count" id="count"></div>
  <div id="tray"></div>
  <div class="toast" id="toast"></div>
  <script src="lists.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
