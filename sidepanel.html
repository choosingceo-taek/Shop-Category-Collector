<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Research Companion</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f9f9f7; --card: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --line: rgba(11,11,11,.11); --accent: #2a78d6; --good: #0ca30c; --warn: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0d0d; --card: #1a1a19; --ink: #fff; --ink2: #c3c2b7; --muted: #898781;
      --line: rgba(255,255,255,.12); --accent: #3987e5; --warn: #d95926; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header { padding: 12px 13px 10px; border-bottom: 1px solid var(--line); background: var(--card); }
  .ctx { font-size: 12px; color: var(--muted); }
  .ctx b { color: var(--ink); font-weight: 600; }
  h1 { font-size: 14px; margin: 0 0 7px; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
  select, button, input {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 7px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row.mt { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .actions { padding: 11px 13px; border-bottom: 1px solid var(--line); background: var(--card); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
  .hint kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  #tray { flex: 1; overflow-y: auto; padding: 11px 13px 24px; }
  .it {
    display: grid; grid-template-columns: 46px 1fr auto; gap: 9px; align-items: start;
    padding: 8px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); margin-bottom: 7px;
  }
  .it img { width: 46px; height: 61px; object-fit: cover; border-radius: 5px; background: var(--line); display: block; }
  .it .n { font-size: 12.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .it .m { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .it .f { font-size: 11px; color: var(--ink2); margin-top: 2px; }
  .it .x { border: 0; background: none; color: var(--muted); padding: 2px 4px; font-size: 13px; }
  .it a { color: inherit; text-decoration: none; }
  .it a:hover .n { text-decoration: underline; }
  .empty { color: var(--muted); text-align: center; padding: 34px 12px; font-size: 12.5px; line-height: 1.6; }
  .count { font-size: 11.5px; color: var(--muted); padding: 0 13px 7px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    background: var(--ink); color: var(--bg); padding: 7px 13px; border-radius: 999px;
    font-size: 12px; opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 9;
  }
  .toast.on { opacity: .95; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>리서치 컴패니언</h1>
    <div class="row">
      <select id="col" class="grow" title="컬렉션"></select>
      <button id="newcol" title="새 컬렉션">＋</button>
    </div>
    <div class="ctx" id="ctx" style="margin-top:7px">페이지 확인 중…</div>
  </header>

  <div class="actions">
    <button id="clip" class="primary grow" style="width:100%">＋ 이 상품 담기</button>
    <div class="row mt">
      <button id="scan" class="grow">전체 스캔 → Excel</button>
      <button id="export" title="내보내기">내보내기</button>
    </div>
    <div class="hint">
      이미지는 페이지에서 <b>우클릭 → 컬렉션에 담기</b>로 추가할 수 있습니다(모든 사이트).
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="tray"></div>
  <div class="toast" id="toast"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
