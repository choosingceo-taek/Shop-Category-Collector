<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Market Lens</title>
<style>
  /* White ground, hairlines, squared corners, uppercase micro-labels.

     Same language as the team's own research screen, and the same one LAB
     uses — the panel and the workbench sit side by side all day, so they
     cannot be two different products. Deliberately light-only: following the
     browser theme meant a designer in dark mode got a black workbench, and
     garment photographs are judged against white.

     Colour is spent on state, never on decoration. Solid ink marks the two
     destinations (LAB, the run); everything else is line work. */
  :root {
    color-scheme: light;
    /* A grouped-list palette warmed off pure grey. Neutral grey plus square
       corners read as a form to fill in; the same layout on a warm ground
       with generous corners reads as something to handle. The structure is
       unchanged — only the temperature and the radii. */
    --bg:#efece5; --card:#fff; --ink:#1d1b18; --ink2:#4a453e; --muted:#8a857c;
    --line:#e6e1d8; --line2:#d8d2c7; --hard:#1d1b18; --wash:#f4f1ea;
    --overlay:rgba(29,27,24,.45);
    /* Colour is spent on state, never on decoration: a run in progress, the
       row being scanned. The brand dots in the list are data, not ornament. */
    --accent:#b4551a; --accent2:#c08552;
    --cta:#1d1b18; --cta-ink:#f7f4ee; --cta-hi:#000;
    --serif: ui-serif, Georgia, "Times New Roman", "Apple SD Gothic Neo", serif;
    --r:16px;                       /* card corner — soft enough to hold */
    --r-s:12px;                     /* controls */
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.5 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  button, select, input { font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line2); border-radius:var(--r-s); padding:7px 12px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--hard); }
  button:disabled { opacity:.4; cursor:default; }
  .solid { background:var(--hard); color:var(--bg); border-color:var(--hard); font-weight:650; }
  textarea, input[type=search] { border-radius:var(--r-s); }
  /* An iOS grouped section: the header sits OUTSIDE, above a white card that
     carries the controls. Nothing needs a border — the card against the grey
     ground is the grouping, which is why a Settings screen stays readable at
     a glance no matter how many rows it holds. */
  .fs { background:var(--card); border-radius:var(--r); padding:10px 11px;
    margin:0 0 12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  /* SCOPE — what this research question is watching. A micro-label rather
     than a titled card header: the word is there to name the thing once, not
     to be read again every time the panel opens, and the list of URLs is what
     the space belongs to. */
  .fhead { display:flex; align-items:center; gap:8px; margin:0 0 7px; height:18px; }
  .fhead .ftools { margin-left:auto; display:flex; gap:3px; align-items:center; }
  .fico { display:none; }
  .fhead .ft { min-width:0; }
  .fhead b { font-size:10px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); }
  .xbtn { font-size:10px; padding:2px 7px; border-radius:999px; background:var(--wash);
    border-color:transparent; color:var(--muted); }
  .xbtn:hover { color:var(--ink); }
  /* off is a state, so it takes the muted treatment rather than vanishing */
  .iconbtn.off { opacity:.45; }
  .cap { text-transform:uppercase; letter-spacing:.1em; font-size:10px; }
  .row { display:flex; gap:6px; align-items:center; }
  .grow { flex:1; min-width:0; }

  /* One row, not two: the lens sits beside the segmented control rather than
     on a line of its own. The top of a narrow panel is the most expensive
     space there is, and it was being spent on an icon. */
  header { padding:9px 12px; background:var(--bg); display:flex;
    align-items:center; gap:9px; }
  .brandline { display:flex; align-items:center; flex:none; }
  .lens { width:20px; height:20px; flex:none; color:var(--ink); display:block; }
  .lens svg { width:100%; height:100%; display:block; }
  .lens.busy { color:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  /* readable by screen readers, invisible on screen */
  .sronly { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  h1 { font-size:13px; margin:0; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
  /* Segmented control, the iOS way of choosing between two views: one track,
     the chosen one lifted onto a white pill. */
  .tabs { display:flex; gap:2px; flex:1; min-width:0; background:#e4e4e9;
    border-radius:9px; padding:2px; }
  .tab { flex:1; border:0; background:none; padding:5px 0 6px; font-size:12px;
    font-weight:600; color:var(--ink2); border-radius:7px; letter-spacing:-.01em; }
  .tab.on { background:var(--card); color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.12); }

  main { flex:1; overflow:hidden; display:flex; flex-direction:column; }
  .view { flex:1; overflow-y:auto; display:none; flex-direction:column; }
  .view.on { display:flex; }
  /* The collector does NOT scroll as a page. What you reach for while browsing
     — the list you are filing into, the capture card, the filter — stays put,
     the brands scroll between them, and the run controls are pinned to the
     bottom. One moving part instead of three. */
  #v-collector { overflow:hidden; }
  #v-collector .listwrap { flex:1; min-height:0; display:flex; flex-direction:column; }
  #v-collector .panelcard { flex:1; min-height:0; display:flex; flex-direction:column; }
  #v-collector .fs.sites { flex:1; min-height:0; display:flex; flex-direction:column; }
  #listbody { flex:1; min-height:80px; overflow-y:auto; overscroll-behavior:contain;
    margin:0 -4px; padding:0 4px; }
  .runbar { flex:none; background:var(--card); border-top:1px solid var(--line);
    padding:8px 12px calc(9px + env(safe-area-inset-bottom)); }
  /* The transport: run · hold · stop, as three round controls. Run carries
     the label because it is the one you press on purpose; the other two only
     matter once something is running, and they say so by waking up. */
  .runbar .runrow { display:flex; align-items:center; gap:9px; margin-bottom:0; }
  .rbtn { display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:38px; width:38px; flex:none; padding:0; border-radius:999px;
    background:var(--wash); border:1px solid var(--line2); color:var(--ink);
    transition:background .15s ease, color .15s ease, transform .12s ease, opacity .15s ease; }
  .rbtn svg { width:18px; height:18px; fill:currentColor; flex:none; }
  .rbtn em { font-style:normal; font-weight:650; font-size:13px; letter-spacing:-.01em; }
  .rbtn.go { flex:1; width:auto; padding:0 15px; justify-content:flex-start;
    background:var(--cta); color:var(--cta-ink); border-color:var(--cta); }
  .rbtn.go:hover:not(:disabled) { background:var(--cta-hi); }
  .rbtn:hover:not(:disabled) { border-color:var(--hard); transform:translateY(-1px); }
  .rbtn:active:not(:disabled) { transform:scale(.96); }
  .rbtn:disabled { opacity:.32; cursor:default; }
  /* a hold in effect is a state, so it is the one thing here that takes colour */
  .rbtn.held { background:var(--accent2); border-color:var(--accent2); color:#fff; opacity:1; }

  /* ---------- COLLECTOR: add the page you're on, curate the list ---------- */
  /* The capture card: what is about to be filed, spelled out. Brand and
     category are what the spreadsheet groups by, so they are the two lines
     the user reads before pressing Add — not the raw address. */
  .adder { margin:0 0 7px; }
  .now { display:flex; align-items:flex-start; gap:9px; padding:10px 11px; margin-bottom:9px;
    background:var(--wash); border:0; border-radius:var(--r-s);
    font-size:11.5px; color:var(--ink2); line-height:1.45; }
  .now .bdot { width:9px; height:9px; border-radius:50%; flex:none; margin-top:4px; }
  .now .txt { flex:1; min-width:0; }
  .now .host { display:block; font-weight:700; color:var(--ink); font-size:12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .now .sub { display:block; color:var(--muted); font-size:11px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .now .badge { display:inline-block; margin-top:3px; padding:1px 6px; font-size:9px;
    letter-spacing:.09em; text-transform:uppercase; border:1px solid var(--line2);
    border-radius:var(--r); color:var(--muted); flex:none; }
  .now .badge.ok { border-color:var(--hard); color:var(--ink); }
  /* Three equal ways to put sites in: this page, a sheet, a pasted block.
     Grabbing one page is normally done on the page itself, at the round
     button in its corner — so none of these is the loud one here. */
  .addrow { display:flex; gap:5px; margin-top:0; }
  .addrow button { flex:1; font-size:11.5px; font-weight:600; padding:6px 4px;
    border-radius:var(--r-s); background:var(--wash); border-color:transparent; }
  .addrow button:disabled { background:var(--wash); color:var(--muted); }
  .addrow button[aria-expanded="true"] { background:var(--ink); color:var(--cta-ink); }

  .listwrap { padding:0 12px 10px; }
  .panelcard { background:none; border:0; padding:0; margin:0; }
  .panelcard > .cap { display:block; color:var(--muted); margin-bottom:8px; }
  .lhead { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  /* Lists as chips: every list and its size readable at rest, one tap to
     switch, and a "＋" that is a list rather than an unlabelled icon. */
  .lchips { display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0; }
  .lchips button { font-size:11.5px; letter-spacing:-.01em; padding:4px 10px;
    border-radius:999px; font-weight:600; background:var(--wash);
    border-color:transparent; }
  .lchips button .n { font-weight:400; opacity:.6; margin-left:5px; }
  .lchips button.on { background:var(--hard); color:var(--bg); border-color:var(--hard); }
  .lchips button.add { font-weight:400; color:var(--muted); }
  .iconbtn { background:var(--wash); border-color:transparent; }
  .iconbtn { width:22px; height:22px; padding:0; display:inline-flex; align-items:center;
    justify-content:center; flex:none; font-size:11px; border-radius:50%; }
  .runrow { display:flex; gap:6px; margin-bottom:8px; }
  .upnote { border:1px solid rgba(80,200,120,.45); border-radius:var(--r); padding:10px 12px;
    margin-bottom:10px; font-size:12px; line-height:1.55; }
  .upnote .uphow { color:var(--muted); font-size:11px; margin:3px 0 8px; }
  .upnote button { width:100%; font-size:11px; font-weight:700; letter-spacing:.05em; }
  .explist { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .explist .cap { color:var(--muted); flex:1; }
  .explist button { font-size:10.5px; padding:4px 9px; letter-spacing:.05em; }
  .runctl { display:flex; gap:6px; margin-bottom:10px; }
  .runctl button { flex:1; font-size:12.5px; font-weight:600; letter-spacing:-.01em;
    padding:9px; border-radius:var(--r-s); }
  .runctl .danger { color:#b4462f; border-color:rgba(180,70,47,.35); }
  /* LAB — the destination. On a white ground the strongest mark available is
     solid ink, and it is spent here rather than scattered. */
  /* The way out to the LAB — still the only solid ink block, but one line
     tall. Its subtitle listed the tabs you find on arrival, which is a thing
     to read every single time for a destination you already know. */
  .labbtn { display:block; text-align:left; margin:0 12px 10px;
    width:calc(100% - 24px); padding:10px 14px; border:0; border-radius:var(--r-s);
    background:var(--hard); color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .labbtn:hover { background:#000; }
  .labbtn .lbmain { display:flex; align-items:center; justify-content:space-between;
    font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .labbtn .lbgo { font-size:15px; opacity:.55; font-weight:400; }
  .labbtn .lbsub { display:none; }
  .capline { display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:11px; color:var(--muted); margin-bottom:12px; }
  .capline select { width:auto; flex:0 0 auto; font-size:11px; padding:3px 6px; }
  .runrow button { flex:1; font-size:13.5px; font-weight:600; letter-spacing:-.01em;
    padding:11px; border-radius:var(--r-s); }
  .qstate { padding:9px 11px; background:var(--wash); font-size:11.5px; margin-bottom:11px;
    border-radius:var(--r-s); border-left:3px solid var(--accent); }
  .result { padding:11px 12px; background:var(--wash); margin-top:11px; font-size:11.5px;
    border-radius:var(--r-s); }
  .result b { font-weight:700; }
  .result button { font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:6px; }

  /* The list itself. After importing a research sheet this is hundreds of
     rows, so it is organised the way the spreadsheet is: brand first, each
     brand a foldable block carrying its own colour and count. The colour is
     derived from the brand name, so the same brand keeps the same mark
     everywhere without anything being stored. */
  .lsearch { display:flex; gap:5px; align-items:center; margin:0 0 6px; }
  .lsearch input { flex:1; min-width:0; font-size:12px; padding:5px 10px;
    border-radius:999px; background:var(--wash); border-color:transparent; }
  .lsearch button { font-size:11px; padding:4px 9px; border-radius:999px;
    background:var(--wash); border-color:transparent; }
  .lsum { font-size:10.5px; color:var(--muted); margin:0 2px 5px; }
  .grp { margin-bottom:10px; border:0; border-radius:var(--r-s);
    background:var(--wash); overflow:hidden; }
  .grp .gname { display:flex; align-items:center; gap:7px; width:100%; text-align:left;
    padding:5px 8px; border:0; border-radius:0; background:none; font-size:11.5px;
    font-weight:700; color:var(--ink); }
  .grp .gname:hover { background:#ececef; }
  .grp .gdot { width:8px; height:8px; border-radius:50%; flex:none; }
  .grp .gnm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grp .gn { color:var(--muted); font-weight:400; font-size:11px; }
  .grp .gcar { color:var(--muted); font-size:9px; flex:none; transition:transform .15s; }
  .grp.fold .gcar { transform:rotate(-90deg); }
  .grp.fold .gbody { display:none; }
  .grp .gbody { padding:0; }
  /* A watched URL, one line. The row is the point of the whole panel, so it
     is what the space goes to — everything above it earns its height or is
     shrunk until it does. */
  .ent { display:flex; align-items:center; gap:6px; padding:4px 8px; margin-top:2px;
    background:var(--wash); border:1px solid transparent; border-radius:var(--r-s); }
  .ent:hover { border-color:var(--line); }
  .ent.cur { background:var(--card); border-color:var(--accent); }
  .ent.done { opacity:.42; }
  .ent .txt { flex:1; min-width:0; }
  /* One line per site: the category, under its brand's group heading. The
     address is identity, not reading matter — it lives in the row's tooltip
     (user request: the list shows brand and category, nothing else). */
  .ent .lb { font-size:11.5px; line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Scan is the norm and needs no label; only the exceptions are marked. */
  .ent .tag { font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line2); border-radius:var(--r); padding:1px 6px; flex:none; }
  .ent .tag.q { border-style:dashed; }
  .ent .tag.on { display:none; }
  .ent .act { border:0; background:none; color:var(--muted); padding:1px 3px; font-size:10.5px; flex:none; }
  .ent .act:hover { color:var(--ink); }
  .lempty { color:var(--muted); font-size:12px; line-height:1.8; padding:22px 0; text-align:center; }

  /* pasting is the rare path — offered beside the others, opened on demand */
  /* the appointment row — one line, same furniture as the rest of the card */
  .sched { margin-top:8px; }
  .schedrow { display:flex; gap:6px; align-items:center; }
  .schedrow input[type=time] { font:inherit; font-size:12px; padding:4px 6px;
    border:1px solid var(--line); border-radius:var(--r); background:#fff; color:var(--ink); }
  .schedrow button.grow { flex:1; font-size:12px; padding:5px 8px; }
  .days { display:flex; gap:2px; }
  .days button { width:20px; height:22px; padding:0; font-size:10px; font-weight:600;
    border:1px solid var(--line); border-radius:var(--r); background:#fff; color:var(--muted); }
  .days button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .sched .hint { font-size:10.5px; color:var(--muted); margin-top:6px; }
  .bulkbox { margin-top:8px; }
  .bulkbox textarea { width:100%; margin-top:8px; font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line2); border-radius:var(--r-s); padding:8px 9px;
    background:var(--card); color:var(--ink); resize:vertical; }
  .bulkbox button { margin-top:6px; width:100%; font-size:12.5px; font-weight:600;
    border-radius:var(--r-s); padding:8px; }
  .bulkbox .hint { font-size:10.5px; color:var(--muted); line-height:1.55; margin-top:7px; }

  .live { padding:9px 14px; font-size:11.5px;
    color:var(--ink2); display:none; }
  .live.on { display:block; }
  .bar { height:2px; background:var(--line); margin-top:7px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:30%;
    animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }

  /* ---------- PRODUCTS: what the scans collected ---------- */
  .filters { padding:11px 14px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; }
  .filters input[type=search] { width:100%; text-transform:uppercase; font-size:10.5px; letter-spacing:.06em; }
  .scopebar { display:flex; align-items:center; gap:8px; padding:6px 9px; background:var(--wash);
    border-left:2px solid var(--hard); font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; font-weight:700; }
  .scopebar button { border:0; background:none; color:var(--muted); padding:0 2px; font-size:11px; }
  .selwrap { flex:1; min-width:0; }
  .selwrap .cap { display:block; color:var(--muted); margin-bottom:3px; }
  .selwrap select { width:100%; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px; }
  .pc { position:relative; background:var(--wash); margin:0; border-radius:var(--r); overflow:hidden; }
  .pc img, .pc .ph { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--wash); }
  .pc figcaption { position:absolute; left:0; right:0; bottom:0; padding:20px 8px 7px;
    background:linear-gradient(transparent, var(--overlay)); color:#fff;
    display:flex; flex-direction:column; gap:1px; }
  .pc .b { font-size:8.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .pc .n { font-size:10px; line-height:1.3; overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .pc .p { font-size:11px; font-weight:700; }
  .pc .p s { font-weight:400; opacity:.7; margin-left:4px; }
  .pc .ck { position:absolute; top:7px; right:7px; width:16px; height:16px; margin:0;
    appearance:none; background:#fff; border:1px solid #111; cursor:pointer; }
  .pc .ck:checked { background:#111; }
  .pc .ck:checked::after { content:"✓"; color:#fff; font-size:10px; display:flex;
    align-items:center; justify-content:center; height:100%; }
  .pc.sel { outline:2px solid var(--hard); outline-offset:-2px; }
  .pempty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 18px;
    font-size:12px; line-height:1.8; }
  .selbar { border-top:1px solid var(--hard); padding:9px 14px; display:none;
    align-items:center; gap:8px; background:var(--bg); }
  .selbar.on { display:flex; }
  .selbar .cnt { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .cir { width:34px; height:34px; border-radius:50%; padding:0; display:inline-flex;
    align-items:center; justify-content:center; font-size:12px; border:1px solid var(--hard); }
  .cir.txt { font-size:9px; font-weight:700; letter-spacing:.05em; }

  /* in-panel prompt/confirm */
  .ask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
    align-items:center; justify-content:center; padding:18px; z-index:20; }
  .ask[hidden] { display:none; }
  /* Any author `display` beats the UA's [hidden] rule, so every flex block in
     here would stay on screen after being hidden — the filter row did exactly
     that on an empty list. One guard, applied everywhere. */
  [hidden] { display:none !important; }
  .askbox { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; width:100%; max-width:320px; }
  .asktext { font-size:12.5px; line-height:1.55; margin-bottom:10px; }
  #askinput { width:100%; margin-bottom:10px; }
  .askrow { display:flex; gap:6px; }
  .askrow button { flex:1; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    font-weight:700; padding:8px; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:16px;
    background:var(--hard); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:11.5px;
    opacity:0; transition:opacity .18s; pointer-events:none; z-index:9; }
  .toast.on { opacity:.97; }
</style>
</head>
<body>
  <header>
    <div class="brandline">
      <!-- The wordmark is gone: Chrome already prints the extension name in the
           side panel's own title bar, so repeating it spent the top of a narrow
           panel saying what the user just read. The lens doubles as the status
           light — it fills and pulses while a scan runs. -->
      <span class="lens" id="dot" title="Market Lens">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
          <path d="M15.4 15.4 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <h1 class="sronly">Market Lens</h1>
    </div>
    <div class="tabs">
      <button class="tab on" data-view="collector">Collector</button>
      <button class="tab" data-view="products">Products</button>
    </div>
  </header>

  <main>
    <!-- COLLECTOR — add whatever page you're on, then curate the list -->
    <section class="view on" id="v-collector">
      <!-- Order follows the work, not the chronology of building it:
           LAB first (where the collected work turns into an answer), then the
           list you are curating, then adding the page you happen to be on —
           which is an action ON that list, so it sits with it. -->
      <div class="upnote" id="upnote" hidden>
        <div><b>Version <span id="upver"></span></b> is available (you have <span id="upcur"></span>)</div>
        <div class="uphow">Download the ZIP, overwrite your folder, reload the extension, then refresh the tab.</div>
        <button id="upget">⬇ Get the new ZIP</button>
      </div>

      <button id="catalog" class="labbtn">
        <span class="lbmain">LAB<span class="lbgo">›</span></span>
        <span class="lbsub">Weekly new-in · By brand · Trends</span>
      </button>

      <div class="live" id="live"><span id="livetext"></span><div class="bar"><i></i></div></div>

      <div class="listwrap">
        <!-- TWO cards, because there are only two things here.

             Lists, adding a page, importing a sheet and the sites themselves
             were four separate blocks, but every one of them is an operation
             on the SAME object — the list. Split apart they read as four
             features to learn; together they read as one thing you manage,
             which is what it is. Scanning is the only genuinely different
             act (it goes out and does work), so it keeps its own card. -->
        <div class="panelcard">

        <div class="fs sites">
          <!-- Named for what it is FOR. "Sites" describes the rows; the point
               is the set of category pages this research question watches
               week after week — so the card says Watchlist. -->
          <div class="fhead"><span class="ft"><b>Scope</b></span>
            <!-- the list's OWN tools: rename it, delete it, take it out.
                 Putting sites IN is a different job and lives with Add. -->
            <span class="ftools" id="ltools">
              <!-- The grab button on the page can be tucked away; this is how
                   it comes back. It rides in the existing tool row, so a
                   setting nobody needs daily costs no height. -->
              <button class="iconbtn" id="fabtoggle" title="Grab button on pages" aria-label="Grab button on pages">◉</button>
              <!-- A list is one research question, and the LAB compares it
                   week to week — so it can keep its own appointment. Rides
                   the same tool row: no new height until it is opened. -->
              <button class="iconbtn" id="schedtoggle" aria-expanded="false" title="Scan this list automatically" aria-label="Scan this list automatically">⏱</button>
              <button class="iconbtn" id="renlist" title="Rename this list" aria-label="Rename this list">✎</button>
              <button class="iconbtn" id="dellist" title="Delete this list" aria-label="Delete this list">🗑</button>
              <button class="xbtn" id="explisttxt" title="Export as .txt — edit it and import again">.txt</button>
              <button class="xbtn" id="explistxlsx" title="Export as .xlsx — edit it and import again">.xlsx</button>
            </span>
          </div>
          <input type="file" id="importfile" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden>

          <!-- The appointment, opened from the clock above. One row: the time,
               the days as chips, and the switch. Closed it costs nothing; the
               list chip carries a small ⏱ so a scheduled list is visible
               without opening anything. -->
          <div class="sched" id="schedbox" hidden>
            <div class="schedrow">
              <input type="time" id="schedtime" value="09:00" title="Local time">
              <span class="days" id="scheddays"></span>
              <button id="schedsave" class="grow">Turn on</button>
            </div>
            <div class="hint" id="schednext"></div>
          </div>

          <!-- which list: chips, not a dropdown — a dropdown hides how many
               lists exist and how big each one is -->
          <div class="lhead">
            <div class="lchips" id="lchips"></div>
            <select id="listsel" title="Choose a list" hidden></select>
          </div>

          <!-- Grabbing one page happens ON the page, at the round button in
               its bottom-right corner — that is where the browsing is. What
               is left here is bringing sites in by the sheet or the block,
               plus a quiet fallback for the pages the button cannot reach
               (a site the extension has no access to yet). -->
          <!-- No status readout here. What the page is and what it will be
               filed as is shown by the grab button ON the page, where the
               decision is actually made; repeating it here was a line that
               spent its life saying "Browser page — can't be added". -->
          <div class="adder">
            <div class="addrow">
              <button id="addbtn" title="Add the page you are on (the round button on the page does this too)">＋ This page</button>
              <button id="importbtn" title="Read a list of sites from a file (.xlsx · .csv · .txt)">⬆ Import list</button>
              <button id="pastetoggle" aria-expanded="false" title="Paste a block of URLs">⌨ Paste URLs</button>
            </div>
            <div class="bulkbox" id="bulkbox" hidden>
              <textarea id="bulk" rows="4" placeholder="Zara
- Dresses : https://www.zara.com/us/en/woman-dresses-l1066.html"></textarea>
              <button id="addbulk">Add to list</button>
              <div class="hint">Import reads Brand · Category · URL columns automatically;
                without headers every line containing a URL is still read.</div>
            </div>
          </div>

          <!-- what is in it -->
          <div class="lsearch" id="lsearch" hidden>
            <input id="lq" type="search" placeholder="Filter sites">
            <button id="lfold" title="Collapse or expand every brand">Collapse</button>
          </div>
          <div id="listbody"></div>

        </div>

        </div>
      </div>

      <!-- The run controls are a fixed bottom bar, the way an iOS toolbar
           works: they never scroll out from under the thumb, and the list of
           brands above is the only thing that moves. -->
      <div class="runbar">
        <div class="qstate" id="qstate" hidden></div>
        <div class="result" id="listresult" hidden>
          <span id="resulttext"></span>
          <div class="row" style="margin-top:7px">
            <button id="listxlsx" class="grow">⬇ Excel</button>
            <button id="listview" class="grow">View</button>
          </div>
        </div>
        <!-- Three round controls, nothing else: run, hold, stop. Icons
             because the bar is a transport, not a form — and because at this
             size a glyph is read faster than a word. Every scan reads the
             first page only, so there is nothing to configure here. -->
        <div class="runrow" role="group" aria-label="Scan controls">
          <button id="runlist" class="rbtn go" title="Scan every site in this list" aria-label="Scan all">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <em id="runlabel">Scan all</em>
          </button>
          <button id="jpause" class="rbtn" title="Hold the run — it keeps its place" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5h3v13H9zM14 5.5h3v13h-3z"/></svg>
          </button>
          <button id="jreset" class="rbtn" title="Stop the run and save what was collected" aria-label="Stop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- PRODUCTS — what the scans collected -->
    <section class="view" id="v-products">
      <div class="filters">
        <div class="scopebar" id="scopebar" hidden>
          <span id="scopetext"></span>
          <button id="scopeclear" title="Show all">✕</button>
        </div>
        <input id="psearch" type="search" placeholder="Search products">
        <div class="row">
          <div class="selwrap"><span class="cap">Brand</span>
            <select id="pbrand"><option value="">All</option></select></div>
          <div class="selwrap"><span class="cap">Category</span>
            <select id="pcat"><option value="">All</option></select></div>
        </div>
      </div>
      <div class="pgrid" id="pgrid"></div>
    </section>
  </main>

  <div class="selbar" id="selbar">
    <span class="cnt" id="selcount">Selected 0</span>
    <span style="flex:1"></span>
    <button class="cir txt" id="selall" title="Select everything shown">ALL</button>
    <button class="cir" id="selreset" title="Clear selection">↺</button>
    <button class="cir" id="selexport" title="Export selected to Excel">⬆</button>
  </div>

  <!-- Chrome side panels do not display window.confirm/prompt/alert, so asking
       anything has to happen inside the panel itself. -->
  <div class="ask" id="ask" hidden>
    <div class="askbox">
      <div class="asktext" id="asktext"></div>
      <input id="askinput" type="text" hidden>
      <div class="askrow">
        <button id="askcancel">Cancel</button>
        <button id="askok" class="solid">OK</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="exceljs.min.js"></script>
  <script src="excel.js"></script>
  <script src="sites.js"></script>
  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
